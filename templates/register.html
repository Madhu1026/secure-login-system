<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Create Account</h1>
        <p class="subtitle">Register a new account</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <label>Name</label>
            <input type="text" name="name" placeholder="Enter your name" maxlength="50" required>

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required>

            <small>Minimum 8 characters with uppercase, lowercase and number.</small>

            <button type="submit">Register</button>
        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="{{ url_for('home') }}">Login</a>
        </p>
    </div>
</div>
</body>
</html>
